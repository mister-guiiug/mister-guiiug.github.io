<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="55%" stop-color="#101a3a"/>
      <stop offset="78%" stop-color="#1a4a6e"/>
      <stop offset="92%" stop-color="#3ec4e0"/>
      <stop offset="100%" stop-color="#f0e6a8"/>
    </linearGradient>
    <clipPath id="coins">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#coins)">
    <rect width="32" height="32" fill="url(#ciel)"/>
    <!-- Étoiles : points blancs, densités variables -->
    <g fill="#fff">
      <circle cx="4" cy="5" r="0.45" opacity="0.9"/>
      <circle cx="9" cy="3.5" r="0.35" opacity="0.7"/>
      <circle cx="14" cy="6" r="0.5" opacity="0.95"/>
      <circle cx="19" cy="4" r="0.3" opacity="0.6"/>
      <circle cx="24" cy="7" r="0.4" opacity="0.85"/>
      <circle cx="28" cy="3" r="0.35" opacity="0.75"/>
      <circle cx="6" cy="11" r="0.3" opacity="0.55"/>
      <circle cx="11" cy="9" r="0.45" opacity="0.9"/>
      <circle cx="17" cy="10.5" r="0.25" opacity="0.5"/>
      <circle cx="22" cy="12" r="0.4" opacity="0.8"/>
      <circle cx="27" cy="9.5" r="0.3" opacity="0.65"/>
      <circle cx="3.5" cy="16" r="0.35" opacity="0.7"/>
      <circle cx="8" cy="14.5" r="0.25" opacity="0.45"/>
      <circle cx="13" cy="15" r="0.4" opacity="0.75"/>
      <circle cx="25" cy="15.5" r="0.35" opacity="0.7"/>
      <circle cx="29" cy="13" r="0.45" opacity="0.9"/>
      <circle cx="5" cy="20" r="0.3" opacity="0.5"/>
      <circle cx="10" cy="18.5" r="0.35" opacity="0.6"/>
      <circle cx="21" cy="19" r="0.3" opacity="0.55"/>
      <circle cx="26.5" cy="21" r="0.4" opacity="0.65"/>
      <!-- Quelques étoiles plus brillantes -->
      <circle cx="12" cy="5" r="0.7" opacity="1"/>
      <circle cx="23" cy="8" r="0.65" opacity="0.95"/>
      <circle cx="7" cy="12.5" r="0.55" opacity="0.85"/>
    </g>
  </g>

  <!--
    M original « sigil » : pics aigus, V central profond, jambages
    qui s'évasent — pas la marque Majin (pas de crochets bas relevés).
    Boîte ≈ ±9.2 × ±9.0, centrée en (16.04, 16.04) (mesure PNG).
  -->
  <g transform="translate(16.04 16.04)">
    <path
      fill="#fff"
      d="M -9.2 8.6
         L -9.2 -6.2
         L -7.4 -8.8
         L -5.0 -6.0
         L 0 -0.2
         L 5.0 -6.0
         L 7.4 -8.8
         L 9.2 -6.2
         L 9.2 8.6
         L 6.4 8.6
         L 6.4 -2.0
         L 0 5.4
         L -6.4 -2.0
         L -6.4 8.6
         Z"
    />
  </g>
</svg>
