<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Sans prix : une étiquette de prix dont le montant est masqué par une
       barre — ce que fait l'extension —, aux couleurs du papier cadeau, sur un
       fond violet. Lisible de 16 à 128 pixels. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#d6336c"/>
    </linearGradient>
    <linearGradient id="barre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc933"/>
      <stop offset="1" stop-color="#ff7eb6"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#fond)"/>
  <g transform="rotate(-32 64 66)">
    <!-- La ficelle, passée dans l'œillet -->
    <path d="M44 66C34 60 26 48 20 36" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".9"/>
    <!-- Ombre portée, légère -->
    <path d="M50 40h40a10 10 0 0 1 10 10v32a10 10 0 0 1-10 10H50L28 66Z" transform="translate(2 5)" fill="#2b0a4d" opacity=".22"/>
    <!-- L'étiquette, son œillet évidé -->
    <path fill="#fff" fill-rule="evenodd" d="M50 40h40a10 10 0 0 1 10 10v32a10 10 0 0 1-10 10H50L28 66ZM50 66a6 6 0 1 0-12 0 6 6 0 0 0 12 0Z"/>
    <!-- Le libellé, et le prix masqué -->
    <rect x="58" y="51" width="22" height="5" rx="2.5" fill="#c9b8ff"/>
    <rect x="58" y="61" width="34" height="15" rx="4" fill="url(#barre)"/>
  </g>
</svg>
