# Construit et publie la racine de l'origine.
#
# ON NE COMMITE RIEN. Les fichiers sont engendrés AU MOMENT DE PUBLIER puis
# téléversés comme artefact Pages : aucun `git push`, donc la règle
# `pull_request` du ruleset « Protect main » reste en place. C'est le remède
# éprouvé sur la vitrine du socle (dev-pwa-config#257) : un workflow qui
# poussait sur `main` y a échoué chaque nuit du 02/09 au 13/09/2026, en
# silence, dès que la branche a été protégée.
#
# CHAQUE NUIT, parce que la page suit deux sources qui bougent sans passer par
# ce dépôt : le catalogue du socle (une application naît à chaque version) et
# la liste des sites publiés (un plan de site apparaît).
#
# ÉCHOUER EST SÛR : si la construction échoue — une application ne répond pas,
# le réseau hoquette —, rien n'est déployé et Pages continue de servir la
# version précédente. Le job de construction tourne aussi sur les PR, comme
# vérification, sans publier.
#
# UNE NUIT SANS CHANGEMENT NE SIGNALE RIEN. Les pages du hub sont datées par
# l'empreinte de leur contenu (`seo-state.json`, relu en ligne à chaque
# construction), et seules celles qui ont changé partent à IndexNow. Les URL des
# applications, elles, sont signalées par chaque app à son déploiement.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      indexnow-tout:
        description: Signaler TOUTES les URL du hub a IndexNow (premier envoi, reprise)
        type: boolean
        default: false

permissions:
  contents: read

# Deux publications ne doivent pas se croiser ; une publication en cours n'est
# pas annulée par la suivante, elle se termine.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

jobs:
  construire:
    name: Construire le site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Les pages du hub dont le contenu a changé, en tableau JSON.
      urls-modifiees: ${{ steps.construction.outputs.urls-modifiees }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Sans réseau, avant tout : le service worker (qui ne doit toucher qu'au
      # hub), les plans de site, les dates, le robots.txt et les pages statiques.
      - name: Tests
        run: node --test test/*.test.mjs

      # Miniatures 640w des cartes : pas de package.json sur ce dépôt, install
      # éphémère. Sans sharp, le build recopie quand même les og-image.
      - name: Installer sharp (miniatures hub)
        run: npm install --no-save sharp@0.34.4

      - name: Engendrer le hub, ses pages, ses plans de site, robots.txt et les vérifications
        id: construction
        run: node scripts/build-site.mjs _site
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publier:
    name: Publier
    needs: construire
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5

      # IndexNow (Bing, DuckDuckGo, Ecosia, Qwant, Yandex…) : APRÈS la
      # publication, la clé doit être en ligne pour être vérifiée. Seules les
      # pages DU HUB dont le contenu a changé partent (sortie `urls-modifiees`
      # de la construction) ; un lancement manuel avec « tout » envoie toutes
      # celles du plan du hub. Les apps signalent les leurs à leur déploiement.
      # Un échec ici ne défait rien : le site est déjà publié.
      #
      # ATTENDRE QUE L'ORIGINE RÉPONDE 200. `deploy-pages` rend la main dès que
      # GitHub a accepté l'artefact ; Fastly peut encore servir un 404 en cache
      # pendant quelques minutes. IndexNow invite Bing à crawler tout de suite :
      # un 4xx à ce moment-là laisse l'URL en « Discovered but not crawled ».
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Attendre que Pages serve l'accueil
        if: needs.construire.outputs.urls-modifiees != '[]' || inputs.indexnow-tout
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              https://mister-guiiug.github.io/ || echo 000)
            echo "essai $i/30 → HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::warning::L'accueil ne répond pas encore 200 — IndexNow vérifiera chaque URL."
      - name: Signaler à IndexNow les pages du hub qui ont changé
        if: needs.construire.outputs.urls-modifiees != '[]' || inputs.indexnow-tout
        continue-on-error: true
        env:
          # Passée par l'environnement, jamais recopiée dans le script du shell.
          URLS_MODIFIEES: ${{ needs.construire.outputs.urls-modifiees }}
        run: node scripts/indexnow.mjs ${{ inputs.indexnow-tout && '--tout' || '' }}
